<style>
  :root { --bg: #fbfaf7; --fg: #23211d; --muted: #6d675d; --line: #dcd6cb; --panel: #f2efe8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1a18; --fg: #ebe7df; --muted: #a39d92; --line: #3a3732; --panel: #24221f; color-scheme: dark; } }
  body { background: var(--bg); color: var(--fg); font: 16px/1.55 Georgia, "Times New Roman", serif; margin: 0; padding: 24px 16px 64px; }

  pre.source { background: var(--panel); margin: 0; padding: 12px; font-size: 0.8rem; line-height: 1.45; overflow-x: auto; white-space: pre-wrap; }
  .value { min-width: 0; }

<main>
  <h1>LaTeX for Omeka</h1>
  <p class="lede">Each example is a transcription as stored in Omeka (left) and as the item page shows it with the module (right). The text is invented for the demo.</p>

</main>

<script type="text/plain" data-title="Equations in a letter">The heat developed in the conductor follows Joule's law, \(H = I^2 R t\), so for the lamp in circuit:
\[ W = \frac{E^2}{R} = \frac{110^2}{140} \approx 86.4 \text{ watts} \]
and across the three branches
\begin{align}
R_{\text{total}} &= \left(\frac{1}{R_1} + \frac{1}{R_2} + \frac{1}{R_3}\right)^{-1} \\
&= 46.\overline{6}\ \Omega
\end{align}
which agrees with the meter.</script>

<script>
  // The same markup the module's PHP writes: the raw text in an attribute, Omeka's own HTML inside.
  function omekaLiteral(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/(\r\n|\n)/g, '<br />$1');
  }
  var host = document.getElementById('examples');
  document.querySelectorAll('script[data-title]').forEach(function (s) {
    var text = s.textContent.replace(/^\n/, '').replace(/&amp;/g, '&');
    var section = document.createElement('section');
    var h = document.createElement('h2');
    h.textContent = s.getAttribute('data-title');
    var pair = document.createElement('div');
    pair.className = 'pair';
    var pre = document.createElement('pre');
    pre.className = 'source';
    pre.textContent = text;
    var value = document.createElement('div');
    value.className = 'value';
    var hasLatex = /\\(?:begin\{[A-Za-z]+\*?\}|\[|\()/.test(text);
    value.innerHTML = hasLatex
      ? '<div class="latex-for-omeka"></div>'
      : omekaLiteral(text);
    if (hasLatex) {
      value.firstChild.setAttribute('data-latex-for-omeka', text);
      value.firstChild.innerHTML = omekaLiteral(text);
    }
    pair.append(pre, value);
    section.append(h, pair);
    host.append(section);
  });
</script>
</body>
</html>
